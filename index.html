<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tellus · Fichas e Combate</title>
<style>
:root{--bg:#14111d;--card:#1e1a2d;--line:#37314f;--ink:#ece8f6;--mut:#9d97b6;--gold:#e9bb55;--vio:#a183ff;--red:#f0627d;--grn:#58d8a7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#2a1f4a,transparent),var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3{font-family:Palatino,'Palatino Linotype',Georgia,serif;margin:.2em 0}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
h1{font-size:1.6rem;color:var(--gold);margin-right:auto}
nav{display:flex;gap:.4rem;flex-wrap:wrap;padding:.6rem 1rem}
button,select,input,textarea{font:inherit;color:var(--ink);background:#26213a;border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem}
button{cursor:pointer}button:hover{border-color:var(--vio)}button.on,button.p{background:var(--vio);color:#120e22;border-color:var(--vio)}button.d{border-color:var(--red)}
main{padding:1rem;max-width:1100px;margin:auto}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin:.6rem 0}
.g{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.r{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.s{margin-left:auto}
.m{color:var(--mut);font-size:.85rem}.bar{height:8px;background:#0e0b16;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
input[type=number]{width:5rem}textarea,.w{width:100%}.warn{color:var(--red);font-weight:700}.cur{border-color:var(--gold)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--vio);border-radius:14px;max-width:900px;width:94vw}dialog::backdrop{background:#000a}
#t{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1200;padding:.6rem 1.4rem;border-radius:10px;font:700 1.4rem Palatino,serif;display:none;z-index:9}
:focus-visible{outline:2px solid var(--gold)}
</style></head><body>
<header><h1>🌍 Tellus</h1><span class=m>Usuário:</span><select id=us></select><button data-a=user>👤 Novo usuário</button><button data-a=grupo>👥 Criar grupo</button></header>
<nav id=nv></nav><main id=app></main><dialog id=md></dialog><div id=t></div>
<script>
const $=s=>document.querySelector(s),q=v=>v==null?'':String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const uid=()=>Math.random().toString(36).slice(2,9),nm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),fx=n=>+(+n).toFixed(1);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem('tl_'+k))??d}catch(e){return d}},W=(k,v)=>localStorage.setItem('tl_'+k,JSON.stringify(v));
const AT=[['for','💪','Força'],['des','🏹','Destreza'],['sen','👁️','Sentidos'],['vig','❤️','Vigor'],['int','🧠','Intelecto']];
const PG=[['💪 Corpo',['Atletismo','Escalada','Impacto','Intimidação','Luta','Natação','Estabilidade']],['📚 Mente',['Artes','Ciências','Conhecimento','Enganação','Intelecto','Investigação','Medicina','Profissão','Tecnologia']],['🗣️ Social',['Adestramento','Carisma','Diplomacia','Intuição','Percepção','Religião','Sensações']],['🛡️ Resistência',['Concentração','Fortitude','Infinidade','Sobrevivência','Tenacidade','Vigor','Vontade']],['🤸 Agilidade',['Acrobacia','Condução','Destreza','Furtividade','Iniciativa','Pontaria','Reflexos']],['✨ Magia',['Arcanismo','Controle','Criação','Emissão','Invocação','Ocultismo','Ritualismo','Selamento','Suporte','Transformação']]];
const ALL=PG.flatMap(g=>g[1]);
const TN={mag:'✨ Magias',hab:'⚡ Habilidades',ite:'🎒 Itens',con:'🌀 Condições',tal:'🏅 Talentos'};
const LB={nome:'Nome',custo:'Custo (ex: 3 mana)',desc:'Descrição',efeito:'Efeito',dano:'Dano (ex: 2d6+3)',pr:'PR (vazio = automático)',est:'Estrelas (1-5)',peso:'Peso',mods:'Altera (ex: for+1 defesa+2 protecao+1)',req:'Requisitos (opcional, ex: for>=3 luta>=10 nivel>=6)'};
const FD={mag:['nome','custo','desc','efeito','dano','pr','est'],hab:['nome','custo','desc','efeito','dano','pr','est'],ite:['nome','peso','desc','efeito','custo','dano','mods'],con:['nome','desc','efeito'],tal:['nome','desc','efeito','req']};
const RQ={mag:['nome','custo','desc','efeito'],hab:['nome','custo','desc','efeito'],ite:['nome'],con:['nome','desc'],tal:['nome','desc','efeito']};
let U=localStorage.getItem('tl_u')||'',V='fichas',FID=null,FT='geral',MF={},AID=null,fichas,repo,groups,users,C;
let AS={tipo:'per',sel:0,t:[],defs:{},roll:'1d20',dmg:''};
function load(){fichas=L('fichas',[]);repo=L('repo',{});['mag','hab','ite','con','tal'].forEach(k=>repo[k]=repo[k]||[]);groups=L('groups',{});users=L('users',[]);C=L('combat',{on:false,round:1,turn:null,parts:[],log:[]})}
function save(){W('fichas',fichas);W('repo',repo);W('groups',groups);W('users',users);W('combat',C)}
function sv(){C.parts.forEach(p=>{const f=fichas.find(x=>x.id==p.fid);if(f)f.cur={pv:p.pv,mn:p.mn,es:p.es}});save();draw()}
const F=()=>fichas.find(f=>f.id==FID);
const can=f=>f.owner==U||f.acc.all||f.acc.users.includes(U)||f.acc.groups.some(g=>(groups[g]||[]).includes(U));
const nf=()=>({id:uid(),owner:U,nome:'Novo personagem',idade:16,exp:0,base:{for:1,des:1,sen:1,vig:1,int:1},san:null,per:{},custom:[],mag:[],hab:[],ite:[],con:[],tal:[],grim:false,cur:{pv:null,mn:null,es:null},acc:{all:false,users:[],groups:[]}});
const rl=n=>Math.floor(Math.random()*n)+1;
function roll(ex){const s=String(ex||0).replace(/(\d*)d(\d+)/gi,(_,n,d)=>{let r=0;for(let i=0;i<(+n||1);i++)r+=rl(+d);return r});return(s.match(/[+-]?\d+/g)||[]).reduce((a,b)=>a+ +b,0)}
const dmax=s=>(String(s||'').replace(/(\d*)d(\d+)/gi,(_,n,d)=>(+n||1)*d).match(/\d+/g)||[]).reduce((a,b)=>a+ +b,0);
const num=s=>+(String(s||'').match(/\d+/)||[0])[0];
function mods(f){const m={};f.ite.forEach(i=>String(i.mods||'').replace(/([a-zA-Zçãõé]+)\s*([+-]\d+)/g,(_,k,n)=>{k=nm(k);m[k]=(m[k]||0)+ +n}));return m}
function calc(f){const m=mods(f),g=f.grim?1:0,p=n=>f.per[n]||0,s5=n=>2*Math.floor(p(n)/5),a={};AT.forEach(([k])=>a[k]=f.base[k]+g+(m[k]||0));
const lv=5+Math.floor(f.exp/5),c={a,lv,pv:15+5*a.vig+s5('Fortitude')+10*Math.floor(lv/5)+(m.vitalidade||0),def:10+(m.protecao||0)+(m.defesa||0),per:10+a.sen+p('Sensações')+(m.percepcao||0),mn:5+2*a.int+s5('Controle')+(m.mana||0),es:5+a.des+s5('Luta')+(m.estamina||0),car:5+2*a.for+s5('Atletismo')+(m.carga||0),peso:2+f.ite.reduce((t,i)=>t+(+i.peso||0),0)};
c.san=(f.san!=null?f.san:2*a.int+Math.floor(lv/5))+(g?3:0)+(m.san||0);return c}
const cur=(f,k,max)=>f.cur[k]==null?max:Math.min(f.cur[k],max);
function pts(f){const total=2*(5+Math.floor(f.exp/5)),at=AT.map(([k,e,n])=>[e+' '+n,2*(f.base[k]-1)]),pe=Object.entries(f.per).filter(e=>e[1]>0).map(e=>[e[0],e[1]/5]),ta=f.tal.length*3,sa=at.reduce((t,x)=>t+x[1],0),sp=pe.reduce((t,x)=>t+x[1],0),mh=f.mag.reduce((n,m)=>n+2*Math.max(1,+m.est||1),0)+f.hab.reduce((n,m)=>n+2*Math.max(1,+m.est||1),0);return{total,at,pe,ta,sa,sp,mh,used:sa+sp+ta+mh,left:total-sa-sp-ta-mh}}
const stars=(m,f)=>'⭐'.repeat(Math.min(9,(m.est||1)+(f.grim?2:0)));
const pr=m=>m.pr!==''&&m.pr!=null?m.pr:Math.round(Math.max(dmax(m.dano),num(m.custo))/(m.gri?3:5));
function reqMiss(f,r){const c=calc(f),X={nivel:c.lv};AT.forEach(([k,,n])=>{X[k]=X[nm(n)]=c.a[k]});const out=[];String(r||'').replace(/([a-zA-ZÀ-ú]+)\s*>=?\s*(-?\d+)/g,(_,k,n)=>{let v=X[nm(k)];if(v==null){const p=ALL.concat(f.custom).find(x=>nm(x)==nm(k));v=p?f.per[p]||0:0}if(v<+n)out.push(`${k} ${n} (tem ${v})`)});return out}
const I=(p,v,x='')=>`<input data-f="${p}" value="${q(v)}" ${x}>`,N=(p,v,x='')=>`<input type=number data-f="${p}" value="${v==null?'':v}" ${x}>`;
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function draw(){$('#us').innerHTML=users.map(u=>`<option ${u==U?'selected':''}>${q(u)}</option>`).join('');
$('#nv').innerHTML=[['fichas','📜 Fichas'],['editor','🧙 Editor'],['pub','📢 Publicar'],['repo','📚 Repositório'],['comb','⚔️ Combate']].map(([k,n])=>`<button data-a=nav data-i=${k} class="${V==k?'on':''}">${n}</button>`).join('');
$('#app').innerHTML=({fichas:vF,editor:vE,pub:vP,repo:vR,comb:vC})[V]()}
const accTxt=f=>f.acc.all?'🌍 todos':[...f.acc.users.map(u=>'👤'+u),...f.acc.groups.map(g=>'👥'+g)].join(' ')||'🔒 só o dono';
function vF(){const l=fichas.filter(can);return`<div class=r><h2>📜 Fichas guardadas</h2><button class=p data-a=nova>➕ Nova ficha</button></div><p class=m>Você só vê e edita fichas que criou ou que o dono liberou para você, para seu grupo ou para todos.</p>`+(l.map(f=>`<div class=c><div class=r><b>${q(f.nome)}</b><span class=m>nível ${calc(f).lv} · dono: ${q(f.owner)} · acesso: ${accTxt(f)}</span><span class=s></span><button data-a=abrir data-i=${f.id}>✏️ Abrir</button>${f.owner==U?`<button data-a=acc data-i=${f.id}>🔑 Acesso</button><button data-a=del data-i=${f.id} class=d>🗑️</button>`:''}</div></div>`).join('')||'<p class=c>Nenhuma ficha ainda. Crie a primeira! ✨</p>')}
function vE(){const f=F();if(!f||!can(f))return'<p class=c>Abra ou crie uma ficha na aba 📜 Fichas.</p>';
const tabs=[['geral','⚙️ Geral'],['per','🎓 Perícias'],...Object.entries(TN)];
return`<div class=r>${tabs.map(([k,n])=>`<button data-a=tab data-i=${k} class="${FT==k?'on':''}">${n}</button>`).join('')}</div>`+(FT=='geral'?eGeral(f):FT=='per'?ePer(f):eList(f,FT))}
function eGeral(f){const c=calc(f),p=pts(f),b=(k,mx)=>`<div class=bar><i style="width:${Math.max(0,100*cur(f,k,mx)/mx)}%"></i></div>`;
return`<div class=c><div class=r><label>Nome ${I('nome',f.nome)}</label><label>Idade ${N('idade',f.idade)}</label><label>EXP ${N('exp',f.exp,'min=0')}</label><b>🎖️ Nível ${c.lv}</b><span class=m>(5 exp = 1 nível)</span></div></div>
<div class=c><h3>✨ Pontos de melhoria</h3><p>Total <b>${p.total}</b> · Gastos <b>${fx(p.used)}</b> · Restantes <b class="${p.left<0?'warn':''}">${fx(p.left)}</b></p><p class=m>💪 Atributos: ${fx(p.sa)} (${p.at.filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join(', ')||'nenhum'})<br>🎓 Perícias: ${fx(p.sp)} (${p.pe.map(x=>x[0]+' '+fx(x[1])).join(', ')||'nenhuma'})<br>✨ Magias e habilidades: ${p.mh} pts<br>🏅 Talentos: ${p.ta} (${f.tal.map(t=>q(t.nome)).join(', ')||'nenhum'})</p></div>
<div class=c><h3>Atributos base</h3><div class=g>${AT.map(([k,e,n])=>`<div class=r>${e} ${n} <button data-a=at data-k=${k} data-d=-1>−</button><b>${f.base[k]}</b>${f.grim?`<span class=m>(+1 grimório = ${c.a[k]})</span>`:''}<button data-a=at data-k=${k} data-d=1>+2pts</button></div>`).join('')}</div>
<div class=r><label>🌀 Sanidade ${N('san',f.san,'placeholder=auto')}</label><b>= ${c.san}</b><span class=m>(vazio = 2×intelecto + nível/5${f.grim?' + 3 temporária':''})</span></div></div>
<div class=c><h3>Atributos secundários</h3><div class=g>
<div>❤️ Vitalidade ${N('cur.pv',cur(f,'pv',c.pv))} / ${c.pv}${b('pv',c.pv)}</div><div>🛡️ Defesa <b>${c.def}</b></div><div>👂 Percepção <b>${c.per}</b></div>
<div>🔮 Mana ${N('cur.mn',cur(f,'mn',c.mn))} / ${c.mn}${b('mn',c.mn)}</div><div>⚡ Estamina ${N('cur.es',cur(f,'es',c.es))} / ${c.es}${b('es',c.es)}</div>
<div>🎒 Carga <b class="${c.peso>c.car?'warn':''}">${c.peso}</b> / ${c.car} ${c.peso>c.car?'<span class=warn>🚨 SOBRECARGA</span>':''}</div></div></div>
<div class=c><label>📕 <b>Grimório</b> (item, peso 2) <input type=checkbox data-f=grim ${f.grim?'checked':''}> ${f.grim?'LIGADO: +1 em todos os atributos, +3 sanidade, magias +2 estrelas':'desligado'}</label></div>`}
function ePer(f){const p=pts(f);return`<div class=c><p>Restantes: <b class="${p.left<0?'warn':''}">${fx(p.left)}</b> pts · 1 ponto de melhoria = 5 pontos de perícia · máximo 35 em cada</p></div>`+PG.map(([g,l])=>`<div class=c><h3>${g}</h3><div class=g>${l.map(n=>`<label>${n} ${N('per.'+n,f.per[n]||0,'min=0 max=35')}</label>`).join('')}</div></div>`).join('')+`<div class=c><h3>🆕 Perícias inventadas</h3><div class=g>${f.custom.map(n=>`<div class=r><label>${q(n)} ${N('per.'+n,f.per[n]||0,'min=0 max=35')}</label><button class=d data-a=delper data-i="${q(n)}">🗑️</button></div>`).join('')}</div><div class=r><input id=np placeholder="Nome da nova perícia"><button data-a=addper>➕ Adicionar</button></div></div>`}
function eList(f,t){return`<div class=c><div class=r><h3>${TN[t]}</h3><button class=p data-a=new data-t=${t}>➕ Novo</button>${t=='tal'?'<span class=m>Cada talento custa 3 pontos e vai para o repositório.</span>':''}</div>`+(f[t].map((m,i)=>{if(t=='mag'&&m.gri&&!f.grim)return'';return`<div class=c><div class=r><b>${q(m.nome)}</b>${m.est?stars(m,f):''}${m.custo?`<span class=m>custo ${q(m.custo)}</span>`:''}${m.dano?`<span class=m>dano ${q(m.dano)}</span>`:''}${m.est?`<span class=m>PR ${pr(m)}</span>`:''}${m.gri?'📕':''}${m.peso?`<span class=m>peso ${q(m.peso)}</span>`:''}<span class=s></span><button data-a=edit data-t=${t} data-i=${i}>✏️</button><button data-a=pub data-t=${t} data-i=${i}>📢</button><button class=d data-a=delt data-t=${t} data-i=${i}>🗑️</button></div><div class=m>${q(m.desc)} ${m.efeito?'· Efeito: '+q(m.efeito):''}${m.mods?' · Altera: '+q(m.mods):''}${m.req?' · Req: '+q(m.req):''}</div>${(m.versoes||[]).length?`<details><summary class=m>📜 ${m.versoes.length} versão(ões) anterior(es)</summary>${m.versoes.map(v=>`<div class=m>${'⭐'.repeat(v.est)} ${q(v.nome)} · custo ${q(v.custo)} · dano ${q(v.dano)} · ${q(v.efeito)}</div>`).join('')}</details>`:''}</div>`}).join('')||'<p class=m>Vazio.</p>')+'</div>'}
function vP(){const l=fichas.filter(f=>f.owner==U);return`<h2>📢 Publicar</h2><p class=m>O que você publica fica disponível para todos no repositório.</p>`+l.map(f=>`<div class=c><div class=r><b>${q(f.nome)}</b><span class=s></span><button data-a=pubf data-i=${f.id}>${f.acc.all?'🌍 Já pública':'📢 Publicar ficha para todos'}</button></div>${Object.keys(TN).map(t=>f[t].map((m,i)=>`<div class=r>${TN[t].split(' ')[0]} ${q(m.nome)}<span class=s></span><button data-a=pubx data-f2=${f.id} data-t=${t} data-i=${i}>📢 Publicar</button></div>`).join('')).join('')}</div>`).join('')||'<p class=c>Você ainda não criou fichas.</p>'}
function vR(){return`<h2>📚 Repositório público</h2><p class=m>Adicione à ficha aberta no Editor.</p>`+Object.keys(TN).map(t=>`<div class=c><h3>${TN[t]}</h3>${repo[t].map((m,i)=>`<div class=r><b>${q(m.nome)}</b><span class=m>por ${q(m.autor)} · ${q(m.desc)}${m.req?' · Req: '+q(m.req):''}</span><span class=s></span><button data-a=take data-t=${t} data-i=${i}>➕ Pegar</button>${m.autor==U?`<button class=d data-a=rmrepo data-t=${t} data-i=${i}>🗑️</button>`:''}</div>`).join('')||'<span class=m>Nada publicado.</span>'}</div>`).join('')}
/* ---- combate ---- */
const part=f=>{const c=calc(f);return{id:uid(),fid:f.id,nome:f.nome,pv:cur(f,'pv',c.pv),pvm:c.pv,mn:cur(f,'mn',c.mn),mnm:c.mn,es:cur(f,'es',c.es),esm:c.es,def:c.def,for:c.a.for,vig:c.a.vig,des:c.a.des,ni:Math.max(1,c.a.des),iniBonus:f.per.Iniciativa||0,ini:0,out:false}};
const rollInit=p=>{let best=0;for(let i=0;i<Math.max(1,p.ni);i++)best=Math.max(best,rl(20));return best+(p.iniBonus||0)};
const opts=(f,t)=>t=='per'?Object.entries(f.per).filter(e=>e[1]>0).map(e=>({nome:e[0],b:e[1]})):(f[t]||[]).filter(x=>!(t=='mag'&&x.gri&&!f.grim)).map(x=>({...x,b:0}));
function fill(f){const e=f&&AS.tipo!='pular'?opts(f,AS.tipo)[AS.sel]:null;AS.dmg=e&&e.dano||'';AS.roll=e&&e.b?'1d20+'+Math.floor(e.b/5):'1d20'}
function nextT(){const P=C.parts;let i=P.findIndex(p=>p.id==C.turn);for(let n=0;n<P.length;n++){i++;if(i>=P.length){i=0;C.round++;C.log.unshift('🔔 Rodada:'+C.round);toast('Rodada:'+C.round)}if(!P[i].out){C.turn=P[i].id;return}}}
function vC(){const free=fichas.filter(f=>can(f)&&!C.parts.some(p=>p.fid==f.id)),a=C.parts.find(p=>p.id==C.turn);
let h=`<div class=c><div class=r><h2>⚔️ Combate</h2>${C.on?`<b style="font-size:1.5rem;color:var(--gold)">Rodada:${C.round}</b><button class=d data-a=end>🏁 Encerrar</button>`:'<button class=p data-a=start>⚔️ Combate</button>'}</div><p class=m>Fichas disponíveis (entre e saia a qualquer momento):</p><div class=r>${free.map(f=>`<button data-a=join data-i=${f.id}>➕ ${q(f.nome)}</button>`).join('')||'<span class=m>Nenhuma ficha livre.</span>'}</div></div>`;
h+=C.parts.map(p=>`<div class="c ${p.id==C.turn&&C.on?'cur':''}" style="${p.out?'opacity:.5':''}"><div class=r><b>${p.id==C.turn&&C.on?'👉 ':''}${q(p.nome)}</b>❤️ ${p.pv}/${p.pvm} 🔮 ${p.mn}/${p.mnm} ⚡ ${p.es}/${p.esm} 🛡️ ${p.def}${C.on?`<label>🎲 Iniciativa <input type=number data-c=ini data-i=${p.id} value=${p.ini}></label>`:''}<span class=s></span><button data-a=out data-i=${p.id}>${p.out?'↩️ Voltar':'🚪 Sair'}</button><button class=d data-a=rm data-i=${p.id}>🗑️</button></div><div class=bar><i style="width:${100*p.pv/p.pvm}%"></i></div></div>`).join('');
if(C.on&&a){const f=fichas.find(x=>x.id==a.fid),t=AS.tipo,o=f&&t!='pular'?opts(f,t):[];
h+=`<div class=c><h3>🎯 Turno de ${q(a.nome)}</h3><div class=r><select data-c=tipo>${[['per','🎓 Perícia'],['hab','⚡ Habilidade'],['mag','✨ Magia'],['ite','🎒 Item'],['tal','🏅 Talento'],['pular','⏭️ Pular turno']].map(([k,n])=>`<option value=${k} ${k==t?'selected':''}>${n}</option>`).join('')}</select>${t!='pular'?`<select data-c=sel>${o.map((e,i)=>`<option value=${i} ${i==AS.sel?'selected':''}>${q(e.nome)}</option>`).join('')||'<option>—</option>'}</select>`:''}</div>`;
if(t!='pular')h+=`<div class=r><label>Teste de acerto <input data-c=roll value="${q(AS.roll)}"></label><button data-a=rt>🎲</button><label>Dano <input data-c=dmg value="${q(AS.dmg)}" placeholder="ex: 2d6+3"></label><button data-a=rd>🎲</button></div><p class=m>Digite dados (2d6+3) ou valores fixos. Alvos (vários) e defesa de cada um:</p>${C.parts.filter(p=>!p.out).map(p=>`<div class=r><label><input type=checkbox data-c=tg data-i=${p.id} ${AS.t.includes(p.id)?'checked':''}> ${q(p.nome)} (🛡️${p.def})</label><select data-c=def data-i=${p.id}>${[['n','sem reação'],['esq','🌀 Esquivar'],['blo','🛡️ Bloquear']].map(([k,n])=>`<option value=${k} ${(AS.defs[p.id]||'n')==k?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}`;
h+=`<button class=p data-a=act>${t=='pular'?'⏭️ Pular':'✅ Usar'}</button></div>`}
return h+`<div class=c><h3>📜 Registro</h3>${C.log.slice(0,25).map(l=>`<div class=m>${q(l)}</div>`).join('')||'<span class=m>—</span>'}</div>`}
function act(){const a=C.parts.find(p=>p.id==C.turn),f=fichas.find(x=>x.id==a.fid),t=AS.tipo;
if(t=='pular'){C.log.unshift('⏭️ '+a.nome+' pulou o turno');nextT();return sv()}
const e=f&&opts(f,t)[AS.sel];if(!e)return alert('Escolha o que usar.');
const K={mana:'mn',estamina:'es',vitalidade:'pv',vida:'pv'},cs=[...String(e.custo||'').matchAll(/(\d+)\s*(mana|estamina|vitalidade|vida)/gi)].map(m=>[+m[1],nm(m[2])]);
for(const[n,k]of cs)if(a[K[k]]<n)return alert('Sem '+k+' suficiente ('+a[K[k]]+'/'+n+').');
cs.forEach(([n,k])=>a[K[k]]-=n);
const te=roll(AS.roll||'1d20'),dm=roll(AS.dmg||0);
C.log.unshift(`${a.nome} usou ${e.nome} (teste ${te}${cs.length?', gasto '+cs.map(c=>c[0]+' '+c[1]).join(' + '):''})`);
AS.t.forEach(id=>{const x=C.parts.find(p=>p.id==id);if(!x||x.out)return;const d=AS.defs[id]||'n';let lim=x.def,r='';
if(d=='esq'){const v=Math.floor(x.des/2)+Math.floor(x.def/2),dr=roll('1d20');lim=dr+v;r=` esquivou (1d20=${dr}+${v}=${lim})`}
const hit=te>=lim;let dn=0;
if(hit&&dm>0){dn=dm;if(d=='blo'){const b=Math.floor(x.for/2)+Math.floor(x.vig/2);dn=Math.max(0,dn-b);r=` bloqueou (-${b})`}x.pv=Math.max(0,x.pv-dn)}
C.log.unshift(`↳ ${x.nome}: ${hit?'acertou':'errou'}${r}${hit&&dm?` → ${dn} de dano (${x.pv}/${x.pvm})${x.pv==0?' 💀 caído':''}`:''}${hit&&e.efeito?' · '+e.efeito:''}`)});
AS.t=[];AS.defs={};nextT();sv()}
/* ---- formulários ---- */
function openForm(t,i){MF={t,i};const e=i>=0?F()[t][i]:{};
$('#md').innerHTML=`<h3>${TN[t]} — ${i>=0?'editar':'novo'}</h3><div class=g><div>${FD[t].map(k=>`<label>${LB[k]}${RQ[t].includes(k)?' *':''}<br><${['desc','efeito'].includes(k)?'textarea':'input'} id=mf_${k} class=w ${k=='est'||k=='peso'?'type=number':''}>${['desc','efeito'].includes(k)?'</textarea>':''}</label>`).join('')}${t=='mag'?'<label><input type=checkbox id=mf_gri> 📕 Pertence ao grimório (PR em 1/3)</label>':''}</div>
<div><h3>📚 Genéricos publicados</h3>${repo[t].map((m,j)=>`<div class=r><span>${q(m.nome)}</span><button data-a=use data-i=${j}>Usar</button></div>`).join('')||'<span class=m>Nada publicado ainda.</span>'}</div></div><div class=r><button class=p data-a=savef>💾 Salvar</button><button data-a=closem>Cancelar</button></div>`;
fillF(e);$('#md').showModal()}
function fillF(e){FD[MF.t].forEach(k=>$('#mf_'+k).value=e[k]??(k=='est'?1:k=='peso'?0:''));if(MF.t=='mag')$('#mf_gri').checked=!!e.gri}
function openAcc(f){AID=f.id;$('#md').innerHTML=`<h3>🔑 Acesso a "${q(f.nome)}"</h3><label><input type=checkbox id=ac_a ${f.acc.all?'checked':''}> 🌍 Todos</label><br><label>Usuários (separe por vírgula)<br><input id=ac_u class=w value="${q(f.acc.users.join(', '))}"></label><br><label>Grupos (separe por vírgula)<br><input id=ac_g class=w value="${q(f.acc.groups.join(', '))}"></label><p class=m>Grupos existentes: ${Object.keys(groups).map(q).join(', ')||'nenhum'}</p><div class=r><button class=p data-a=saveacc>💾 Salvar</button><button data-a=closem>Cancelar</button></div>`;$('#md').showModal()}
const pubItem=(t,m)=>{const i=repo[t].findIndex(x=>x.nome==m.nome&&x.autor==U),c={...m,autor:U,rid:uid()};i>=0?repo[t][i]=c:repo[t].push(c);toast('Publicado!')};
const ACT={
nav:d=>{V=d.i;draw()},user:()=>{const n=(prompt('Nome do usuário:')||'').trim();if(n){if(!users.includes(n))users.push(n);U=n;localStorage.setItem('tl_u',n);sv()}},
grupo:()=>{const n=(prompt('Nome do grupo:')||'').trim(),m=n&&prompt('Usuários do grupo (separe por vírgula):');if(n&&m!=null){groups[n]=m.split(',').map(s=>s.trim()).filter(Boolean);sv()}},
nova:()=>{if(!U)return ACT.user();const f=nf();fichas.push(f);FID=f.id;V='editor';FT='geral';sv()},
abrir:d=>{FID=d.i;V='editor';draw()},del:d=>{if(confirm('Apagar esta ficha?')){fichas=fichas.filter(f=>f.id!=d.i);sv()}},
acc:d=>openAcc(fichas.find(f=>f.id==d.i)),closem:()=>$('#md').close(),
saveacc:()=>{const f=fichas.find(x=>x.id==AID),l=s=>$(s).value.split(',').map(x=>x.trim()).filter(Boolean);f.acc={all:$('#ac_a').checked,users:l('#ac_u'),groups:l('#ac_g')};$('#md').close();sv()},
pubf:d=>{fichas.find(f=>f.id==d.i).acc.all=true;sv();toast('Ficha liberada para todos!')},
pubx:d=>{pubItem(d.t,fichas.find(f=>f.id==d.f2)[d.t][d.i]);sv()},pub:(d,f)=>{pubItem(d.t,f[d.t][d.i]);sv()},
tab:d=>{FT=d.i;draw()},
at:(d,f)=>{const n=f.base[d.k]+ +d.d;if(n<-2)return;if(+d.d>0&&pts(f).left<2)return alert('Faltam pontos de melhoria (cada aumento custa 2).');f.base[d.k]=n;sv()},
addper:(d,f)=>{const n=$('#np').value.trim();if(!n||ALL.includes(n)||f.custom.includes(n))return;f.custom.push(n);sv()},
delper:(d,f)=>{f.custom=f.custom.filter(x=>x!=d.i);delete f.per[d.i];sv()},
new:d=>openForm(d.t,-1),edit:d=>openForm(d.t,+d.i),
delt:(d,f)=>{if(confirm('Apagar?')){f[d.t].splice(d.i,1);sv()}},
use:d=>fillF(repo[MF.t][d.i]),
savef:()=>{const f=F(),{t,i}=MF,o={};FD[t].forEach(k=>o[k]=$('#mf_'+k).value.trim());if(t=='mag')o.gri=$('#mf_gri').checked;
const miss=RQ[t].filter(k=>!o[k]);if(miss.length)return alert('Preencha: '+miss.map(k=>LB[k].split(' (')[0]).join(', '));
if('est'in o)o.est=Math.min(5,Math.max(1,+o.est||1));
if(t=='tal'){const m=reqMiss(f,o.req);if(m.length)return alert('Requisitos não cumpridos: '+m.join(', '));if(i<0&&pts(f).left<3&&!confirm('Faltam pontos (talento custa 3). Adicionar mesmo assim?'))return}
if(t=='mag'||t=='hab'){const before=i>=0?2*Math.max(1,+F()[t][i].est||1):0,after=2*Math.max(1,+o.est||1),delta=after-before;if(delta>pts(f).left)return alert('Pontos de melhoria insuficientes. Esta magia/habilidade custa '+after+' pontos no total; faltam '+(delta-pts(f).left)+'.')}
if(i>=0){const old=f[t][i];o.versoes=old.est!=null&&old.est!=o.est?[...(old.versoes||[]),{...old,versoes:undefined}]:old.versoes;f[t][i]=o}else f[t].push(o);
if(t=='tal'&&i<0&&!repo.tal.some(x=>x.nome==o.nome))repo.tal.push({...o,autor:U,rid:uid()});$('#md').close();sv()},
take:(d,f)=>{f=F();if(!f||!can(f))return alert('Abra uma ficha no Editor primeiro.');const m={...repo[d.t][d.i]};delete m.autor;delete m.rid;
if(d.t=='tal'){const x=reqMiss(f,m.req);if(x.length)return alert('Requisitos não cumpridos: '+x.join(', '))}f[d.t].push(m);sv();toast('Adicionado à ficha!')},
rmrepo:d=>{repo[d.t].splice(d.i,1);sv()},
join:d=>{const f=fichas.find(x=>x.id==d.i),p=part(f);if(C.on){p.ini=rollInit(p);C.log.unshift('➕ '+p.nome+' entrou (maior de '+p.ni+'d20 + perícia '+(p.iniBonus||0)+' = '+p.ini+')')}C.parts.push(p);if(C.on)C.parts.sort((a,b)=>b.ini-a.ini);sv()},
out:d=>{const p=C.parts.find(x=>x.id==d.i);p.out=!p.out;C.log.unshift((p.out?'🚪 ':'↩️ ')+p.nome+(p.out?' saiu':' voltou'));if(p.out&&C.turn==p.id)nextT();sv()},
rm:d=>{if(C.turn==d.i)nextT();C.parts=C.parts.filter(x=>x.id!=d.i);sv()},
start:()=>{if(!C.parts.length)return alert('Coloque fichas no combate primeiro.');C.on=true;C.round=1;C.log=['⚔️ Combate iniciado! Rodada:1'];C.parts.forEach(p=>{p.ini=rollInit(p);C.log.push('🎲 '+p.nome+': maior de '+p.ni+'d20 + perícia ('+(p.iniBonus||0)+') = '+p.ini)});C.parts.sort((a,b)=>b.ini-a.ini);C.turn=(C.parts.find(p=>!p.out)||{}).id;AS.sel=0;fill(fichas.find(f=>f.id==(C.parts[0]||{}).fid));toast('Rodada:1');sv()},
end:()=>{C.on=false;C.turn=null;C.log.unshift('🏁 Combate encerrado');sv()},
rt:()=>{AS.roll=String(roll(AS.roll||'1d20'));draw()},rd:()=>{AS.dmg=String(roll(AS.dmg||0));draw()},act};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset,F())});
document.addEventListener('change',e=>{const el=e.target;
if(el.id=='us'){U=el.value;localStorage.setItem('tl_u',U);return draw()}
if(el.dataset.f){const f=F(),ks=el.dataset.f.split('.');let o=f;ks.slice(0,-1).forEach(k=>o=o[k]);const k=ks[ks.length-1];o[k]=el.type=='checkbox'?el.checked:el.type=='number'?(el.value===''?(k=='san'||k=='pv'||k=='mn'||k=='es'?null:0):Math.max(0,+el.value)):el.value;if(ks[0]=='per')o[k]=Math.min(35,o[k]||0);if(ks[0]=='per'&&!o[k])delete o[k];return sv()}
const c=el.dataset.c;if(!c)return;const a=C.parts.find(p=>p.id==C.turn),f=a&&fichas.find(x=>x.id==a.fid);
if(c=='tipo'){AS.tipo=el.value;AS.sel=0;fill(f)}else if(c=='sel'){AS.sel=+el.value;fill(f)}else if(c=='roll')AS.roll=el.value;else if(c=='dmg')AS.dmg=el.value;
else if(c=='tg'){AS.t=el.checked?[...AS.t,el.dataset.i]:AS.t.filter(x=>x!=el.dataset.i)}else if(c=='def')AS.defs[el.dataset.i]=el.value;
else if(c=='ini'){C.parts.find(p=>p.id==el.dataset.i).ini=+el.value;C.parts.sort((x,y)=>y.ini-x.ini);return sv()}
draw()});
addEventListener('storage',()=>{load();draw()});
load();if(!U){U=(prompt('Bem-vindo(a) ao Tellus! Seu nome de usuário:')||'Jogador').trim();localStorage.setItem('tl_u',U)}if(!users.includes(U)){users.push(U);save()}draw();
</script></body></html>
